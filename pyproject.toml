[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallexbot"
version = "0.1.0"
description = "Wallex Grid Trading Bot (paper trading only)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Arash Rasoulzadeh"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "websockets>=12.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.92",
    "ruff>=0.6",
    "mypy>=1.10",
    "freezegun>=1.5",
    "mutmut>=2.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
ui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
wallexbot = "wallexbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wallexbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_public: tests that hit public Wallex endpoints (disabled by default)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-config --strict-markers -p no:warnings -m 'not live_public'"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/wallexbot"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "UP042",  # (str, Enum) kept on purpose: StrEnum changes str() output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T201"]
"src/wallexbot/cli/**" = ["T201"]  # the CLI prints to the terminal by design
"**/__init__.py" = ["F401"]  # re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_missing_imports = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.yaml", "*.yml"]

[tool.hypothesis]
database = ".hypothesis"
verbosity = "verbose"
phases = ["explicit", "reuse", "generate", "shrink"]
max_examples = 1000