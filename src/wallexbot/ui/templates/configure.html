{% extends "base.html" %}
{% block content %}
<h1 data-i18n="cfg.title">Configure the grid</h1>
<p class="lead" data-i18n="cfg.intro"></p>

<div class="card">
    <form id="form" class="form-grid" autocomplete="off">
        <div><label for="symbol" data-i18n="cfg.market">Market</label>
            <input id="symbol" name="symbol" list="markets" required><datalist id="markets"></datalist></div>
        <div><label for="lower_price" data-i18n="cfg.lower">Lower price</label><input id="lower_price" inputmode="decimal"></div>
        <div><label for="upper_price" data-i18n="cfg.upper">Upper price</label><input id="upper_price" inputmode="decimal"></div>
        <div><label for="grid_count" data-i18n="cfg.count">Grid levels</label><input id="grid_count" type="number" min="2" step="1"></div>
        <div><label for="mode" data-i18n="cfg.mode">Spacing mode</label>
            <select id="mode"><option value="arithmetic" data-i18n="cfg.mode.arithmetic"></option>
                <option value="geometric" data-i18n="cfg.mode.geometric"></option></select></div>
        <div><label for="total_investment" data-i18n="cfg.invest">Investment in the grid</label><input id="total_investment" inputmode="decimal"></div>
        <div><label for="initial_balance_quote" data-i18n="cfg.capital">Starting balance</label><input id="initial_balance_quote" inputmode="decimal"></div>
        <div><label for="fee_maker" data-i18n="cfg.feeMaker">Maker fee</label><input id="fee_maker" inputmode="decimal"></div>
        <div><label for="fee_taker" data-i18n="cfg.feeTaker">Taker fee</label><input id="fee_taker" inputmode="decimal"></div>
        <div><label for="min_notional" data-i18n="cfg.minNotional">Minimum order value</label><input id="min_notional" inputmode="decimal"></div>
        <div><label for="recenter_after_minutes" data-i18n="cfg.recenter">Move the grid after (minutes)</label>
            <input id="recenter_after_minutes" type="number" min="1" step="1" placeholder="off"></div>
        <div><label for="max_drawdown" data-i18n="cfg.maxDd">Max drawdown</label><input id="max_drawdown" inputmode="decimal"></div>
        <div><label for="daily_loss_limit" data-i18n="cfg.dailyLoss">Daily loss limit</label><input id="daily_loss_limit" inputmode="decimal"></div>
    </form>
    <div class="note" data-i18n="cfg.feeNote"></div>
    <p class="muted" data-i18n="cfg.recenterHelp"></p>
    <div id="defaults-note"></div>
    <div id="result"></div>
    <div class="actions">
        <button id="save" type="button" data-i18n="common.save">Save configuration</button>
        <button id="reset" type="button" class="secondary" data-i18n="common.reset">Reset to defaults</button>
    </div>
    <div id="saved"></div>
</div>

<script>
wb.ready.then(async function () {
    const $ = function (id) { return document.getElementById(id); };
    const FIELDS = {
        symbol: ['market', 'symbol'],
        lower_price: ['strategy', 'grid', 'lower_price'], upper_price: ['strategy', 'grid', 'upper_price'],
        grid_count: ['strategy', 'grid', 'grid_count'], mode: ['strategy', 'grid', 'mode'],
        total_investment: ['strategy', 'grid', 'total_investment'],
        initial_balance_quote: ['simulation', 'initial_balance_quote'],
        fee_maker: ['simulation', 'fee_maker'], fee_taker: ['simulation', 'fee_taker'],
        min_notional: ['simulation', 'min_notional'],
        recenter_after_minutes: ['strategy', 'grid', 'recenter_after_minutes'],
        max_drawdown: ['risk', 'max_drawdown'], daily_loss_limit: ['risk', 'daily_loss_limit']
    };

    function get(cfg, path) { return path.reduce(function (o, k) { return o[k]; }, cfg); }
    function set(cfg, path, value) {
        const last = path[path.length - 1];
        get(cfg, path.slice(0, -1))[last] = value;
    }

    let base = await wb.config.current();

    function fill(cfg) {
        Object.keys(FIELDS).forEach(function (id) { const v = get(cfg, FIELDS[id]); $(id).value = v === null || v === undefined ? '' : v; });
    }
    function collect() {
        const cfg = JSON.parse(JSON.stringify(base));
        Object.keys(FIELDS).forEach(function (id) {
            const raw = $(id).value.trim();
            let value = raw;
            if (id === 'grid_count') { value = raw === '' ? 0 : parseInt(raw, 10); }
            if (id === 'recenter_after_minutes') { value = raw === '' ? null : parseInt(raw, 10); }
            set(cfg, FIELDS[id], value);
        });
        return cfg;
    }

    async function validate() {
        const box = wb.clear($('result'));
        let answer;
        try { answer = await wb.post('/api/config/validate', collect()); }
        catch (e) { box.appendChild(wb.el('div', { class: 'error', text: e.message })); return null; }
        if (!answer.valid) {
            box.appendChild(wb.el('div', { class: 'error', text: wb.t('cfg.invalid') + ': ' + answer.errors.join('; ') }));
            return false;
        }
        const d = answer.derived;
        const rows = [
            ['cfg.spacing', wb.num(d.spacing, 4)],
            ['cfg.spacingPct', wb.num(Number(d.spacing_pct) * 100, 3) + '%'],
            ['cfg.perLevel', wb.num(d.per_grid_investment, 2)],
            ['cfg.roundTrip', wb.num(Number(d.round_trip_fee_rate) * 100, 3) + '%'],
            ['cfg.profitCycle', wb.num(d.min_profit_per_cycle_after_fees, 4)]
        ];
        box.appendChild(wb.el('div', { class: 'ok', text: wb.t('cfg.valid') }));
        const table = wb.el('table', {});
        rows.forEach(function (r) { table.appendChild(wb.el('tr', {}, wb.el('td', { text: wb.t(r[0]) }), wb.el('td', { text: r[1] }))); });
        box.appendChild(table);
        return true;
    }

    let timer = null;
    function later() { clearTimeout(timer); timer = setTimeout(validate, 350); }
    document.querySelectorAll('#form input, #form select').forEach(function (n) { n.addEventListener('input', later); });
    document.addEventListener('wb:lang', validate);

    $('save').addEventListener('click', async function () {
        const ok = await validate();
        const note = wb.clear($('saved'));
        if (ok) {
            base = collect();
            wb.config.save(base);
            note.appendChild(wb.el('div', { class: 'ok', text: wb.t('common.saved') }));
        }
    });
    $('reset').addEventListener('click', async function () {
        wb.config.clear();
        base = await wb.api('/api/config/default');
        fill(base);
        wb.clear($('saved'));
        validate();
    });

    // market suggestions (spot markets from the public API); the form still works without them
    wb.api('/api/markets').then(function (markets) {
        const list = $('markets');
        markets.forEach(function (m) { list.appendChild(wb.el('option', { value: m.symbol })); });
    }).catch(function () { /* offline: free text */ });

    // choosing a coin loads a starting grid sized for it (the user still reviews and saves)
    async function loadDefaults(symbol) {
        const note = wb.clear($('defaults-note'));
        try {
            const d = await wb.api('/api/markets/' + encodeURIComponent(symbol) + '/defaults');
            base = d.config;
            fill(base);
            validate();
            note.appendChild(wb.el('div', { class: d.valid ? 'ok' : 'error', text: wb.t('cfg.defaultsLoaded', { symbol: symbol }) }));
            d.notes.forEach(function (n) { note.appendChild(wb.el('p', { class: 'muted', text: n })); });
        } catch (e) {
            note.appendChild(wb.el('div', { class: 'error', text: wb.t('cfg.defaultsFailed') + ': ' + e.message }));
        }
    }
    $('symbol').addEventListener('change', function () {
        const v = $('symbol').value.trim().toUpperCase();
        if (v) { loadDefaults(v); }
    });

    fill(base);
    validate();
    const wanted = new URLSearchParams(location.search).get('symbol');
    if (wanted) { loadDefaults(wanted.toUpperCase()); }
});
</script>
{% endblock %}
