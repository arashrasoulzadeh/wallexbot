{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>History & Analytics</h2>
    <div class="badge badge-paper">PAPER MODE</div>

    <div class="grid" style="margin-bottom: 1rem;">
        <div class="form-group">
            <label>Run</label>
            <select id="history-run" hx-get="/api/runs" hx-trigger="load" hx-target="this">
                <option value="">All Runs</option>
            </select>
        </div>
        <div class="form-group">
            <label>Market</label>
            <select id="history-market">
                <option value="USDTTMN">USDTTMN</option>
            </select>
        </div>
        <div class="form-group">
            <label>Time Range</label>
            <select id="history-range" onchange="updateTimeRange()">
                <option value="1h">Last 1 Hour</option>
                <option value="24h" selected>Last 24 Hours</option>
                <option value="7d">Last 7 Days</option>
                <option value="30d">Last 30 Days</option>
                <option value="custom">Custom...</option>
            </select>
        </div>
        <div class="form-group" id="custom-range" style="display: none;">
            <label>From</label>
            <input type="datetime-local" id="custom-from">
        </div>
        <div class="form-group" id="custom-to" style="display: none;">
            <label>To</label>
            <input type="datetime-local" id="custom-to">
        </div>
    </div>

    <div class="grid" style="margin-top: 1rem;">
        <div class="card" style="flex: 2;">
            <h3>Price Chart</h3>
            <div id="history-price-chart" class="chart-container"></div>
        </div>
        <div class="card" style="flex: 1;">
            <h3>PnL Overview</h3>
            <div id="history-pnl-summary"></div>
            <canvas id="history-pnl-chart" height="200"></canvas>
        </div>
    </div>

    <div class="grid" style="margin-top: 1rem;">
        <div class="card">
            <h3>Equity Curve</h3>
            <canvas id="equity-chart" height="300"></canvas>
        </div>
        <div class="card">
            <h3>Drawdown</h3>
            <canvas id="drawdown-chart" height="300"></canvas>
        </div>
    </div>

    <div class="grid" style="margin-top: 1rem;">
        <div class="card">
            <h3>Profit Breakdown</h3>
            <div id="profit-breakdown"></div>
        </div>
        <div class="card">
            <h3>Trade Statistics</h3>
            <div id="trade-stats"></div>
        </div>
    </div>

    <div class="card" style="margin-top: 1rem;">
        <h3>Orders / Fills / Events</h3>
        <div class="grid" style="margin-bottom: 1rem;">
            <button onclick="loadTable('orders')">Orders</button>
            <button onclick="loadTable('fills')">Fills</button>
            <button onclick="loadTable('events')">Events</button>
            <button onclick="loadTable('cycles')">Cycles</button>
        </div>
        <div id="table-container"></div>
    </div>

    <div class="card" style="margin-top: 1rem;">
        <h3>Run Comparison</h3>
        <div class="form-group">
            <label>Compare Runs</label>
            <select id="compare-run-1" multiple>
                <option value="">Select runs...</option>
            </select>
            <select id="compare-run-2" multiple>
                <option value="">Select runs...</option>
            </select>
        </div>
        <button onclick="compareRuns()">Compare</button>
        <div id="comparison-result"></div>
    </div>
</div>

<script>
    let priceChart = null;
    let pnlChart = null;

    function initCharts() {
        const priceCtx = document.getElementById('history-price-chart');
        if (priceCtx) {
            priceChart = LightweightCharts.createChart(priceCtx, {
                width: priceCtx.clientWidth,
                height: 400,
                layout: { backgroundColor: '#ffffff', textColor: '#333' },
                grid: { vertLines: { color: '#eee' }, horzLines: { color: '#eee' } },
            });
        }
    }

    async function loadData() {
        const runId = document.getElementById('history-run').value;
        const range = document.getElementById('history-range').value;
        
        // Load PnL
        if (runId) {
            const pnlRes = await fetch(`/api/history/pnl?run_id=${runId}&resolution=1h`);
            const pnl = await pnlRes.json();
            renderPnlChart(pnl);
            
            // Load breakdown
            const breakdownRes = await fetch(`/api/history/breakdown?run_id=${runId}`);
            const breakdown = await breakdownRes.json();
            renderBreakdown(breakdown);
            
            // Load stats
            const statsRes = await fetch(`/api/history/stats?run_id=${runId}`);
            const stats = await statsRes.json();
            renderStats(stats);
            
            // Load drawdown
            const ddRes = await fetch(`/api/history/drawdown?run_id=${runId}`);
            const dd = await ddRes.json();
            renderDrawdown(dd);
        }
    }

    function renderPnlChart(pnl) {
        // Render equity curve
    }

    function renderBreakdown(breakdown) {
        const el = document.getElementById('profit-breakdown');
        el.innerHTML = `
            <p><strong>Total Profit:</strong> ${breakdown.total_profit} TMN</p>
            <p><strong>Total Cycles:</strong> ${breakdown.total_cycles}</p>
            <p><strong>Winning:</strong> ${breakdown.winning_cycles} | <strong>Losing:</strong> ${breakdown.losing_cycles}</p>
            <p><strong>Avg Win:</strong> ${breakdown.avg_win} | <strong>Avg Loss:</strong> ${breakdown.avg_loss}</p>
        `;
    }

    function renderStats(stats) {
        const el = document.getElementById('trade-stats');
        el.innerHTML = `
            <p><strong>Total Trades:</strong> ${stats.count || 0}</p>
            <p><strong>Avg Size:</strong> ${stats.avg_size || 0} USDT</p>
        `;
    }

    function renderDrawdown(dd) {
        // Render drawdown chart
    }

    async function loadTable(type) {
        const runId = document.getElementById('history-run').value;
        if (!runId) return;
        
        const res = await fetch(`/api/history/${type}?run_id=${runId}`);
        const data = await res.json();
        
        const container = document.getElementById('table-container');
        container.innerHTML = renderTable(type, data);
    }

    function renderTable(type, data) {
        if (!data.length) return '<p>No data</p>';
        
        const headers = Object.keys(data[0]);
        let html = '<table><thead><tr>';
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead><tbody>';
        
        data.forEach(row => {
            html += '<tr>';
            headers.forEach(h => html += `<td>${row[h]}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function updateTimeRange() {
        const range = document.getElementById('history-range').value;
        const showCustom = range === 'custom';
        document.getElementById('custom-range').style.display = showCustom ? 'block' : 'none';
        document.getElementById('custom-to').style.display = showCustom ? 'block' : 'none';
    }

    function compareRuns() {
        const run1 = Array.from(document.getElementById('compare-run-1').selectedOptions).map(o => o.value);
        const run2 = Array.from(document.getElementById('compare-run-2').selectedOptions).map(o => o.value);
        // Comparison logic
    }

    document.addEventListener('DOMContentLoaded', () => {
        initCharts();
        loadData();
    });
</script>
{% endblock %}
