{% extends "base.html" %}
{% block content %}
<h1 data-i18n="paper.title">Paper trading</h1>
<p class="lead" data-i18n="paper.intro"></p>

<div class="card">
    <div class="form-grid">
        <div><label for="feed" data-i18n="paper.feed">Price feed</label>
            <select id="feed"><option value="ws" data-i18n="paper.feedWs"></option>
                <option value="poll" data-i18n="paper.feedPoll"></option></select></div>
    </div>
    <div class="actions">
        <button id="start" type="button" data-i18n="paper.start">Start</button>
        <button id="pause" type="button" class="secondary" data-i18n="paper.pause">Pause</button>
        <button id="resume" type="button" class="secondary" data-i18n="paper.resume">Resume</button>
        <button id="stop" type="button" class="secondary" data-i18n="paper.stop">Stop</button>
        <button id="kill" type="button" class="danger" data-i18n="paper.kill">Kill switch</button>
        <span id="state-badge"></span> <span id="conn-badge"></span>
    </div>
    <div id="message"></div>
</div>

<div id="idle" class="note" data-i18n="paper.noRun"></div>

<div id="live" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="grid">
        <div class="card"><h2 data-i18n="paper.grid">Grid ladder</h2><div class="scroll"><table class="ladder" id="ladder"></table></div></div>
        <div class="card"><h2 data-i18n="paper.balances">Balances</h2><div class="scroll"><table id="balances"></table></div></div>
    </div>
    <div class="grid">
        <div class="card"><h2 data-i18n="paper.orders">Open orders</h2><div class="scroll"><table id="orders"></table></div></div>
        <div class="card"><h2 data-i18n="paper.fills">Recent fills</h2><div class="scroll"><table id="fills"></table></div></div>
    </div>
    <div class="card"><h2 data-i18n="paper.events">Events</h2><ul class="events" id="events"></ul></div>
</div>

<script>
wb.ready.then(function () {
    const $ = function (id) { return document.getElementById(id); };
    let runId = wb.read(wb.KEYS.paperRun);
    let socket = null;
    let finished = false;
    let last = null;

    const FINAL = ['stopped', 'halted', 'failed'];

    function say(kind, text) {
        const box = wb.clear($('message'));
        if (text) { box.appendChild(wb.el('div', { class: kind, text: text })); }
    }

    function table(node, head, rows) {
        wb.clear(node);
        const tr = wb.el('tr', {});
        head.forEach(function (h) { tr.appendChild(wb.el('th', { text: wb.t(h) })); });
        node.appendChild(wb.el('thead', {}, tr));
        const body = wb.el('tbody', {});
        rows.forEach(function (cells) {
            const row = wb.el('tr', {});
            cells.forEach(function (cell) {
                row.appendChild(wb.el('td', cell && cell.cls ? { class: cell.cls, text: cell.text } : { text: String(cell) }));
            });
            body.appendChild(row);
        });
        node.appendChild(body);
    }

    function side(s) { return { cls: s === 'BUY' ? 'buy' : 'sell', text: wb.t('side.' + s) }; }

    function stat(label, value, cls) {
        return wb.el('div', { class: 'stat' }, wb.el('div', { class: 'label', text: wb.t(label) }),
            wb.el('div', { class: 'value ' + (cls || ''), text: value }));
    }

    function setButtons(state) {
        const running = state === 'running', paused = state === 'paused';
        const active = running || paused;
        $('start').disabled = active;
        $('pause').disabled = !running;
        $('resume').disabled = !paused;
        $('stop').disabled = !active;
        $('kill').disabled = !active;
        $('feed').disabled = active;
    }

    function render(run) {
        last = run;
        const s = run.status;
        $('idle').style.display = 'none';
        $('live').style.display = '';
        wb.clear($('state-badge')).appendChild(wb.badge(s.state));
        setButtons(s.state);

        const change = (s.equity !== null && s.initial_equity !== null && Number(s.initial_equity) !== 0)
            ? (Number(s.equity) - Number(s.initial_equity)) / Number(s.initial_equity) * 100 : null;
        const stats = wb.clear($('stats'));
        [
            stat('paper.price', wb.num(s.last_price, 4)),
            stat('paper.equity', change === null ? '--' : wb.pct(change, 3), wb.signClass(change)),
            stat('paper.realized', wb.num(s.realized_pnl, 2), wb.signClass(s.realized_pnl)),
            stat('paper.unrealized', wb.num(s.unrealized_pnl, 2), wb.signClass(s.unrealized_pnl)),
            stat('paper.cycles', String(s.completed_cycles)),
            stat('paper.fees', wb.num(s.fees_paid, 2)),
            stat('paper.orders', String(s.open_orders))
        ].forEach(function (n) { stats.appendChild(n); });
        if (s.halt_reason) { say('error', wb.t('paper.haltedBecause') + ': ' + s.halt_reason); }

        // ladder: highest price first, with the current price marked in between
        const price = run.grid.price === null ? null : Number(run.grid.price);
        const levels = run.grid.levels.slice().sort(function (a, b) { return Number(b.price) - Number(a.price); });
        const ladder = wb.clear($('ladder'));
        const head = wb.el('tr', {});
        ['col.price', 'col.order'].forEach(function (h) { head.appendChild(wb.el('th', { text: wb.t(h) })); });
        ladder.appendChild(wb.el('thead', {}, head));
        const body = wb.el('tbody', {});
        let marked = false;
        levels.forEach(function (lv) {
            if (!marked && price !== null && Number(lv.price) <= price) {
                body.appendChild(wb.el('tr', { class: 'here' }, wb.el('td', { colspan: '2', text: wb.t('paper.here') + ': ' + wb.num(price, 4) })));
                marked = true;
            }
            const cls = lv.order ? 'order-' + lv.order : '';
            body.appendChild(wb.el('tr', { class: cls }, wb.el('td', { text: wb.num(lv.price, 4) }),
                wb.el('td', { text: lv.order ? wb.t('side.' + lv.order) : '--' })));
        });
        if (!marked && price !== null) {
            body.appendChild(wb.el('tr', { class: 'here' }, wb.el('td', { colspan: '2', text: wb.t('paper.here') + ': ' + wb.num(price, 4) })));
        }
        ladder.appendChild(body);

        table($('balances'), ['col.asset', 'col.free', 'col.locked', 'col.total'],
            run.balances.map(function (b) { return [b.asset, wb.num(b.free, 4), wb.num(b.locked, 4), wb.num(b.total, 4)]; }));
        table($('orders'), ['col.level', 'col.side', 'col.price', 'col.qty', 'col.filled'],
            run.orders.map(function (o) { return [o.level === null ? '--' : o.level, side(o.side), wb.num(o.price, 4), wb.num(o.quantity, 4), wb.num(o.filled, 4)]; }));
        table($('fills'), ['col.time', 'col.side', 'col.price', 'col.qty', 'col.fee'],
            run.fills.slice(0, 20).map(function (f) { return [wb.time(f.time), side(f.side), wb.num(f.price, 4), wb.num(f.quantity, 4), wb.num(f.fee, 6) + ' ' + f.fee_asset]; }));
        const events = wb.clear($('events'));
        s.events.slice().reverse().forEach(function (e) { events.appendChild(wb.el('li', { text: e })); });
    }

    function setConn(on) {
        wb.clear($('conn-badge')).appendChild(wb.el('span', { class: 'badge ' + (on ? 'on' : 'off'), text: wb.t(on ? 'paper.connected' : 'paper.disconnected') }));
    }

    function connect() {
        if (!runId || finished) { return; }
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(proto + '://' + location.host + '/api/stream?run_id=' + encodeURIComponent(runId));
        socket.onopen = function () { setConn(true); };
        socket.onmessage = function (event) {
            const message = JSON.parse(event.data);
            render(message.run);
            if (message.final) { finished = true; }
        };
        socket.onclose = function (event) {
            setConn(false);
            if (event.code === 4404) { forget(); return; }       // the server no longer knows this run
            if (!finished) { setTimeout(connect, 2000); }          // transient: try again
        };
    }

    function forget() {
        wb.remove(wb.KEYS.paperRun); runId = null; finished = false;
        $('live').style.display = 'none'; $('idle').style.display = '';
        wb.clear($('state-badge')); setButtons('idle');
    }

    async function control(action) {
        try {
            await wb.post('/api/runs/' + runId + '/' + action);
            const run = await wb.api('/api/runs/' + runId);
            render(run);
            say('', '');
        } catch (e) { say('error', e.message); }
    }

    $('start').addEventListener('click', async function () {
        say('', '');
        try {
            const config = await wb.config.current();
            const started = await wb.post('/api/paper-runs', { config: config, feed: $('feed').value });
            runId = started.id; finished = false;
            wb.write(wb.KEYS.paperRun, runId);
            connect();
        } catch (e) { say('error', e.message); }
    });
    $('pause').addEventListener('click', function () { control('pause'); });
    $('resume').addEventListener('click', function () { control('resume'); });
    $('stop').addEventListener('click', function () { control('stop'); });
    $('kill').addEventListener('click', function () {
        if (window.confirm(wb.t('paper.confirmKill'))) { control('kill'); }
    });
    document.addEventListener('wb:lang', function () { if (last) { render(last); } });

    setButtons('idle');
    setConn(false);
    if (runId) {
        wb.api('/api/runs/' + runId).then(function (run) {
            render(run);
            if (FINAL.indexOf(run.status.state) === -1) { connect(); } else { finished = true; }
        }).catch(function () { forget(); });
    }
});
</script>
{% endblock %}
