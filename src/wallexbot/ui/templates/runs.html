{% extends "base.html" %}
{% block content %}
<h1 data-i18n="runs.title">Runs</h1>

<div class="card">
    <div class="scroll"><table id="runs"></table></div>
    <p id="empty" class="muted" data-i18n="runs.empty" style="display:none"></p>
</div>

<div class="card">
    <h2 data-i18n="runs.detail">Run details</h2>
    <div id="detail"><span class="muted" data-i18n="runs.select"></span></div>
</div>

<script>
wb.ready.then(function () {
    const $ = function (id) { return document.getElementById(id); };
    let selected = null;

    function cells(table, head, rows) {
        wb.clear(table);
        const tr = wb.el('tr', {});
        head.forEach(function (h) { tr.appendChild(wb.el('th', { text: wb.t(h) })); });
        table.appendChild(wb.el('thead', {}, tr));
        const body = wb.el('tbody', {});
        rows.forEach(function (r) { body.appendChild(r); });
        table.appendChild(body);
    }

    async function list() {
        let runs;
        try { runs = await wb.api('/api/runs'); } catch (e) { return; }
        $('empty').style.display = runs.length ? 'none' : '';
        runs.sort(function (a, b) { return Number(b.started_at) - Number(a.started_at); });
        cells($('runs'), ['runs.id', 'runs.market', 'runs.status', 'runs.started', 'common.open'], runs.map(function (r) {
            return wb.el('tr', {}, wb.el('td', { text: r.id }), wb.el('td', { text: r.market }),
                wb.el('td', {}, wb.badge(r.status)), wb.el('td', { text: wb.time(r.started_at) }),
                wb.el('td', {}, wb.el('button', { class: 'secondary', type: 'button', text: wb.t('common.open'),
                    onclick: function () { selected = r.id; detail(); } })));
        }));
    }

    async function detail() {
        if (!selected) { return; }
        const box = wb.clear($('detail'));
        try {
            const results = await Promise.all([
                wb.api('/api/runs/' + selected), wb.api('/api/runs/' + selected + '/pnl'),
                wb.api('/api/runs/' + selected + '/orders'), wb.api('/api/runs/' + selected + '/fills')]);
            const run = results[0], pnl = results[1];
            box.appendChild(wb.el('p', {}, wb.el('strong', { text: run.id }), ' ', wb.badge(run.status.state)));
            const t = wb.el('table', {});
            [['paper.realized', pnl.realized], ['paper.unrealized', pnl.unrealized], ['paper.fees', pnl.fees]].forEach(function (r) {
                t.appendChild(wb.el('tr', {}, wb.el('td', { text: wb.t(r[0]) }), wb.el('td', { class: wb.signClass(r[1]), text: wb.num(r[1], 2) })));
            });
            box.appendChild(t);
            box.appendChild(wb.el('p', { class: 'muted', text: wb.t('paper.orders') + ': ' + results[2].length + ' / ' + wb.t('paper.fills') + ': ' + results[3].length }));
            if (run.status.halt_reason) { box.appendChild(wb.el('div', { class: 'error', text: run.status.halt_reason })); }
        } catch (e) { box.appendChild(wb.el('div', { class: 'error', text: e.message })); }
    }

    list();
    setInterval(function () { list(); detail(); }, 5000);
    document.addEventListener('wb:lang', function () { list(); detail(); });
});
</script>
{% endblock %}
