{% extends "base.html" %}
{% block content %}
<h1 data-i18n="bt.title">Backtest</h1>
<p class="lead" data-i18n="bt.intro"></p>

<div class="card">
    <h2 data-i18n="bt.config">Configuration used</h2>
    <p id="config-summary" class="muted"></p>
    <div class="form-grid">
        <div><label for="from" data-i18n="bt.from">From</label><input id="from" type="date"></div>
        <div><label for="to" data-i18n="bt.to">To</label><input id="to" type="date"></div>
        <div><label for="resolution" data-i18n="bt.resolution">Candle size</label>
            <select id="resolution">
                <option value="1">1 min</option><option value="15">15 min</option>
                <option value="60" selected>1 h</option><option value="240">4 h</option>
                <option value="1D">1 day</option>
            </select></div>
    </div>
    <div class="actions">
        <button id="run" type="button" data-i18n="bt.run">Run backtest</button>
        <button id="compare" type="button" class="secondary" data-i18n="bt.compare">Compare with holding and re-centering</button>
        <button id="fees" type="button" class="secondary" data-i18n="bt.fees">Fee tiers</button>
    </div>
    <div class="form-grid">
        <div><label for="wait" data-i18n="bt.wait">Re-center wait for the comparison (minutes)</label>
            <input id="wait" type="number" min="1" step="1" value="60"></div>
    </div>
    <div id="status"></div>
</div>

<div id="output"></div>
<div id="tools"></div>
<p class="muted" data-i18n="bt.limits"></p>

<script>
wb.ready.then(async function () {
    const $ = function (id) { return document.getElementById(id); };
    const day = 86400000;
    function iso(ms) { return new Date(ms).toISOString().slice(0, 10); }
    $('to').value = iso(Date.now());
    $('from').value = iso(Date.now() - 3 * day);

    let config = await wb.config.current();
    function summary() {
        const g = config.strategy.grid;
        $('config-summary').textContent = config.market.symbol + ': ' + wb.num(g.lower_price, 4) + ' - ' +
            wb.num(g.upper_price, 4) + ', ' + g.grid_count + ' / fee ' + config.simulation.fee_maker + '+' + config.simulation.fee_taker;
    }
    summary();

    const ROWS = [
        ['m.totalReturn', 'total_return_pct', 'pct', true], ['m.buyHold', 'buy_and_hold_return', 'pct', true],
        ['m.outperf', 'outperformance', 'pct', true], ['m.realized', 'realized_pnl', 'num', true],
        ['m.unrealized', 'unrealized_pnl', 'num', true], ['m.cycles', 'completed_cycles', 'int', false],
        ['m.avgCycle', 'avg_profit_per_cycle', 'num', false], ['m.fees', 'fees_paid', 'num', false],
        ['m.maxDd', 'max_drawdown', 'plain%', false], ['m.inRange', 'time_in_range', 'plain%', false],
        ['m.rejected', 'rejected_orders', 'int', false]
    ];

    function curve(points) {
        const values = points.map(Number);
        const lo = Math.min.apply(null, values), hi = Math.max.apply(null, values), span = (hi - lo) || 1;
        const coords = values.map(function (v, i) {
            return (i / Math.max(values.length - 1, 1) * 300).toFixed(1) + ',' + (95 - (v - lo) / span * 90).toFixed(1);
        }).join(' ');
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'curve'); svg.setAttribute('viewBox', '0 0 300 100'); svg.setAttribute('preserveAspectRatio', 'none');
        const line = document.createElementNS(ns, 'polyline'); line.setAttribute('points', coords);
        svg.appendChild(line);
        return svg;
    }

    function show(result) {
        const out = wb.clear($('output'));
        const card = wb.el('div', { class: 'card' });
        const table = wb.el('table', {});
        ROWS.forEach(function (r) {
            const raw = result.metrics[r[1]];
            let text;
            if (r[2] === 'pct') { text = wb.pct(raw); }
            else if (r[2] === 'plain%') { text = wb.num(raw, 2) + '%'; }
            else if (r[2] === 'int') { text = String(raw); }
            else { text = wb.num(raw, 2); }
            table.appendChild(wb.el('tr', {}, wb.el('td', { text: wb.t(r[0]) }),
                wb.el('td', { class: r[3] ? wb.signClass(raw) : '', text: text })));
        });
        card.appendChild(table);
        out.appendChild(card);
        if (result.equity_curve && result.equity_curve.length > 1) {
            out.appendChild(wb.el('div', { class: 'card' }, wb.el('h2', { text: wb.t('bt.curve') }), curve(result.equity_curve)));
        }
        if (result.events && result.events.length) {
            const ul = wb.el('ul', { class: 'events' });
            result.events.forEach(function (e) { ul.appendChild(wb.el('li', { text: e })); });
            out.appendChild(wb.el('div', { class: 'card' }, wb.el('h2', { text: wb.t('bt.events') }), ul));
        }
    }

    /* the two extra tools: three strategies side by side, and fee tiers */
    let tool = null;   // what is on screen, so a language switch can redraw it

    function toolTable(head, rows) {
        const table = wb.el('table', {});
        const tr = wb.el('tr', {});
        head.forEach(function (h) { tr.appendChild(wb.el('th', { class: h[1] || '', text: wb.t(h[0]) })); });
        table.appendChild(wb.el('thead', {}, tr));
        const body = wb.el('tbody', {});
        rows.forEach(function (cells) {
            const row = wb.el('tr', {});
            cells.forEach(function (c, i) {
                row.appendChild(wb.el('td', { class: ((head[i][1] || '') + ' ' + (c.cls || '')).trim(), text: c.text !== undefined ? c.text : String(c) }));
            });
            body.appendChild(row);
        });
        table.appendChild(body);
        return wb.el('div', { class: 'scroll' }, table);
    }

    function drawTool() {
        const box = wb.clear($('tools'));
        if (!tool) { return; }
        const card = wb.el('div', { class: 'card' });
        if (tool.kind === 'compare') {
            const d = tool.data;
            card.appendChild(wb.el('h2', { text: wb.t('bt.cmp.title') }));
            card.appendChild(toolTable(
                [['bt.cmp.strategy'], ['m.totalReturn', 'num'], ['m.realized', 'num'], ['m.maxDd', 'num'], ['m.cycles', 'num'], ['bt.cmp.moves', 'num']],
                d.rows.map(function (r) {
                    return [wb.t('bt.cmp.' + r.label), { text: wb.pct(r.return_pct), cls: wb.signClass(r.return_pct) },
                        wb.num(r.realized, 2), wb.num(r.max_drawdown, 2) + '%', r.cycles, r.recenters];
                })));
            card.appendChild(wb.el('p', { class: 'muted', text: wb.t('bt.cmp.note', { minutes: d.recenter_after_minutes, candles: d.candles }) }));
        } else {
            const d = tool.data;
            card.appendChild(wb.el('h2', { text: wb.t('bt.fee.title') }));
            card.appendChild(toolTable(
                [['bt.fee.fee', 'num'], ['bt.fee.check'], ['m.cycles', 'num'], ['m.realized', 'num'], ['m.fees', 'num'], ['m.totalReturn', 'num']],
                d.rows.map(function (r) {
                    return [wb.num(Number(r.fee) * 100, 3) + '%', wb.t(r.clears_break_even ? 'bt.fee.ok' : 'bt.fee.fails'),
                        r.cycles, wb.num(r.realized, 2), wb.num(r.fees_paid, 2),
                        { text: wb.pct(r.total_return_pct), cls: wb.signClass(r.total_return_pct) }];
                })));
            card.appendChild(wb.el('p', { text: wb.t('bt.fee.breakEven', { fee: wb.num(Number(d.break_even_fee) * 100, 2) }) }));
            card.appendChild(wb.el('p', { class: 'muted', text: wb.t('bt.fee.note') }));
        }
        box.appendChild(card);
    }

    async function runTool(kind, path, extra) {
        const status = wb.clear($('status'));
        wb.clear($('output')); tool = null; drawTool();
        const from = Math.floor(new Date($('from').value + 'T00:00:00Z').getTime() / 1000);
        const to = Math.floor(new Date($('to').value + 'T23:59:59Z').getTime() / 1000);
        ['run', 'compare', 'fees'].forEach(function (id) { $(id).disabled = true; });
        status.appendChild(wb.el('p', { class: 'muted', text: wb.t('bt.running') }));
        try {
            const body = Object.assign({ config: config, from_ts: from, to_ts: to, resolution: $('resolution').value }, extra);
            tool = { kind: kind, data: await wb.post(path, body) };
            wb.clear(status);
            drawTool();
        } catch (e) {
            wb.clear(status);
            status.appendChild(wb.el('div', { class: 'error', text: e.message }));
        } finally { ['run', 'compare', 'fees'].forEach(function (id) { $(id).disabled = false; }); }
    }

    $('compare').addEventListener('click', function () {
        runTool('compare', '/api/backtests/compare', { recenter_after_minutes: parseInt($('wait').value, 10) || 60 });
    });
    $('fees').addEventListener('click', function () { runTool('fees', '/api/backtests/fees', {}); });
    document.addEventListener('wb:lang', drawTool);

    $('run').addEventListener('click', async function () {
        tool = null; drawTool();
        const status = wb.clear($('status'));
        wb.clear($('output'));
        const from = Math.floor(new Date($('from').value + 'T00:00:00Z').getTime() / 1000);
        const to = Math.floor(new Date($('to').value + 'T23:59:59Z').getTime() / 1000);
        $('run').disabled = true;
        status.appendChild(wb.el('p', { class: 'muted', text: wb.t('bt.running') }));
        try {
            const started = await wb.post('/api/backtests', { config: config, from_ts: from, to_ts: to, resolution: $('resolution').value });
            let result;
            do {
                await new Promise(function (r) { setTimeout(r, 1000); });
                result = await wb.api('/api/backtests/' + started.id);
            } while (result.status === 'running');
            wb.clear(status);
            if (result.status === 'failed') {
                status.appendChild(wb.el('div', { class: 'error', text: wb.t('bt.failed') + ': ' + result.error }));
            } else { show(result); }
        } catch (e) {
            wb.clear(status);
            status.appendChild(wb.el('div', { class: 'error', text: e.message }));
        } finally { $('run').disabled = false; }
    });
});
</script>
{% endblock %}
